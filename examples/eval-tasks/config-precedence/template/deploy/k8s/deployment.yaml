apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: shop-api
          image: registry.internal/shop-api:7.3.1
          env:
            - name: NODE_ENV
              value: production
            - name: SHOPAPI_POOL_MAX
              value: "40"
            - name: SHOPAPI_LOG_LEVEL
              value: warn
            - name: PORT
              value: "8080"
          resources:
            limits: { cpu: "1", memory: 512Mi }
