name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines says >=20, so the oldest supported line is tested too, not just the current one.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The plugin's dist/ is committed (Claude Code installs by cloning, with no build step), so a
      # src change committed without rebuilding would ship stale hooks to every user.
      - name: Check the committed plugin bundle matches src
        run: git diff --exit-code -- packages/claude-plugin/dist || (echo "packages/claude-plugin/dist is stale — run pnpm build and commit it" && exit 1)

      - run: pnpm lint
      # tsconfig.json builds src without the tests; this type-checks the tests too.
      - run: pnpm typecheck
      - run: pnpm test

  # The eval harness itself, with no model calls: every task's template fails its hidden acceptance
  # tests and its solution passes (verify.mjs), and tasks.mjs's workspace tools apply a solution and
  # refuse paths outside the copy (--selftest). The evals need Node 22 (.nvmrc); the packages, 20+.
  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node examples/eval-tasks/verify.mjs
      - name: tasks.mjs --selftest
        working-directory: packages/core
        run: node eval/tasks.mjs --selftest
      # Every eval number in README.md and PREREGISTRATION.md must match the saved results.
      - name: check-docs
        working-directory: packages/core
        run: node eval/check-docs.mjs

  # Known vulnerabilities in any dependency, dev tools included. High or critical fails the build;
  # Dependabot (.github/dependabot.yml) proposes the updates.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
