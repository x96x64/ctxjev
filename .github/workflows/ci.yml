name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing else: no job here writes to the repository, packages, or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # engines says >=20, so the oldest supported line is tested too, not just the current one.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The plugin's dist/ is committed (Claude Code installs by cloning, with no build step), so a
      # src change committed without rebuilding would ship stale hooks to every user.
      - name: Check the committed plugin bundle matches src
        run: git diff --exit-code -- packages/claude-plugin/dist || (echo "packages/claude-plugin/dist is stale — run pnpm build and commit it" && exit 1)

      - run: pnpm lint
      # tsconfig.json builds src without the tests; this type-checks the tests too.
      - run: pnpm typecheck
      - run: pnpm test

  # The eval harness itself, with no model calls: every task's template fails its hidden acceptance
  # tests and its solution passes (verify.mjs), and tasks.mjs's workspace tools apply a solution and
  # refuse paths outside the copy (--selftest). The evals need Node 22 (.nvmrc); the packages, 20+.
  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node examples/eval-tasks/verify.mjs
      # The Round 2 task format (real history diffs, pristine-copy checks, Japanese probes) on its
      # fixture, and every committed session against its task format's rules.
      - name: harness-selftest and check-sessions
        working-directory: packages/core
        run: |
          node eval/harness-selftest.mjs
          node eval/check-sessions.mjs
      # The eval agent's commands run in a sandbox (packages/core/eval/sandbox.mjs), and --selftest
      # fails unless it keeps the agent inside its copy of the repo and off the network. Ubuntu 24.04
      # restricts the user namespaces the `unshare` backend needs; lift that for this job only.
      - name: Allow user namespaces (for the unshare sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: tasks.mjs --selftest (unshare sandbox)
        working-directory: packages/core
        run: node eval/tasks.mjs --selftest
        env:
          CTXJEV_SANDBOX: unshare
      - name: tasks.mjs --selftest (docker sandbox, the default image)
        working-directory: packages/core
        run: |
          docker pull node:22-bookworm
          node eval/tasks.mjs --selftest
        env:
          CTXJEV_SANDBOX: docker
      # Every eval number in README.md and PREREGISTRATION.md must match the saved results.
      - name: check-docs
        working-directory: packages/core
        run: node eval/check-docs.mjs

  # Known vulnerabilities in any dependency, dev tools included. High or critical fails the build;
  # Dependabot (.github/dependabot.yml) proposes the updates.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
