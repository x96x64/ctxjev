name: Publish to npm

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write # to tag the release and create its GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted publishing needs npm CLI >= 11.5.1 — newer than what ships with Node 22 by default.
      # An exact version, not @latest, so a release never runs an npm nobody chose; bump it on purpose.
      - run: npm install -g npm@12.1.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      # Scoring must still beat the offline keyword baseline, keep each labeled fixture's top
      # entries, and keep as many of the dev sessions' key facts under a token budget as plain
      # truncation does — regressions the live tests alone (which only check "never drop relevant")
      # miss. Three runs, averaged, because Jev's answers vary slightly between calls. Fails without
      # the TYPESAFE_API_KEY secret, rather than passing with nothing checked.
      - name: Eval gate
        working-directory: packages/core
        run: node eval/run.mjs --gate --runs 3
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      # The 7 version-lockstep files must agree, and every `ctxjev-mcp@<version>` pin in the MCP
      # setup examples must name this release (`node scripts/check-versions.mjs --update-pins`).
      - name: Check version lockstep and pins
        run: node scripts/check-versions.mjs

      # pnpm publish doesn't yet know about OIDC trusted publishing (pnpm/pnpm#9812), but `pnpm pack`
      # correctly rewrites `workspace:*` dependency ranges into the tarball — so pack with pnpm, then
      # hand the tarball to npm's own OIDC-aware `publish`. Order matters: ctxjev-core first, since
      # the other two declare a real version dependency on it once packed.
      - name: Publish ctxjev-core
        working-directory: packages/core
        run: |
          pnpm pack
          npm publish ctxjev-core-*.tgz

      - name: Publish ctxjev-cli
        working-directory: packages/cli
        run: |
          pnpm pack
          npm publish ctxjev-cli-*.tgz

      - name: Publish ctxjev-mcp
        working-directory: packages/mcp-server
        run: |
          pnpm pack
          npm publish ctxjev-mcp-*.tgz

      # The release notes are this version's own CHANGELOG section, so the two can't drift apart.
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file release-notes.md
