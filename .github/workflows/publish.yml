name: Publish to npm

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write # to tag the release and create its GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted publishing needs npm CLI >= 11.5.1 — newer than what ships with Node 22 by default.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      # Scoring must still beat the offline keyword baseline and keep each labeled fixture's top
      # entries — a regression the live tests alone (which only check "never drop relevant") miss.
      - name: Eval gate
        working-directory: packages/core
        run: node eval/run.mjs --gate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      # CHANGELOG.md documents these 7 files as version-lockstep: a bump in one is a bump in all.
      # They drifted silently for five releases (0.1.3-0.1.7) before anyone noticed — check it here
      # instead of trusting it gets remembered by hand every time.
      - name: Check version lockstep
        run: |
          node -e '
            const fs = require("fs");
            const files = [
              "packages/core/package.json",
              "packages/cli/package.json",
              "packages/mcp-server/package.json",
              "packages/claude-plugin/package.json",
              ".claude-plugin/marketplace.json",
              "packages/claude-plugin/.claude-plugin/plugin.json",
              "plugins/ctxjev/plugin.json",
            ];
            const versions = files.map((f) => [f, JSON.parse(fs.readFileSync(f, "utf8")).version]);
            const distinct = new Set(versions.map(([, v]) => v));
            if (distinct.size > 1) {
              console.error("Version lockstep violated:");
              for (const [f, v] of versions) console.error(`  ${v}  ${f}`);
              process.exit(1);
            }
            console.log(`All 7 lockstep files agree on version ${versions[0][1]}`);
          '

      # pnpm publish doesn't yet know about OIDC trusted publishing (pnpm/pnpm#9812), but `pnpm pack`
      # correctly rewrites `workspace:*` dependency ranges into the tarball — so pack with pnpm, then
      # hand the tarball to npm's own OIDC-aware `publish`. Order matters: ctxjev-core first, since
      # the other two declare a real version dependency on it once packed.
      - name: Publish ctxjev-core
        working-directory: packages/core
        run: |
          pnpm pack
          npm publish ctxjev-core-*.tgz

      - name: Publish ctxjev-cli
        working-directory: packages/cli
        run: |
          pnpm pack
          npm publish ctxjev-cli-*.tgz

      - name: Publish ctxjev-mcp
        working-directory: packages/mcp-server
        run: |
          pnpm pack
          npm publish ctxjev-mcp-*.tgz

      # The release notes are this version's own CHANGELOG section, so the two can't drift apart.
      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file release-notes.md
